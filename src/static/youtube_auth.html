<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Authorization</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      .container {
        text-align: center;
      }
      input,
      button {
        padding: 10px;
        margin: 5px;
        font-size: 16px;
      }
      button {
        background-color: #ff0000;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #cc0000;
      }
      pre {
        background-color: #f0f0f0;
        padding: 15px;
        text-align: left;
        max-width: 100%;
        margin: 10px auto;
        overflow-x: auto;
        border-radius: 4px;
        border: 1px solid #ddd;
      }
      .status {
        font-weight: bold;
        margin: 15px 0;
      }
      .error {
        color: #cc0000;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>YouTube Authorization</h1>
      <p>Enter your login access token from /auth/callback:</p>
      <input
        type="text"
        id="tokenInput"
        placeholder="Bearer <login_access_token>"
        style="width: 300px"
      />
      <br />
      <button id="authButton">Authorize YouTube</button>
      <p id="status" class="status"></p>
      <pre id="result"></pre>
    </div>

    <script src="/static/youtube_auth.js"></script>
  </body>
</html>
